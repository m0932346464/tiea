<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TIEA 會員資料更新</title>
<meta name="robots" content="noindex">
<link rel="icon" href="tiea-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: 頁首品牌列（TIEA 徽章＋協會名稱｜北科大 Logo）→ 兩張等高卡片（說明＋選屆別｜整體進度＋大會）→ 各屆卡片（統一格式的格狀排列） */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --ink:#141C2E; --muted:#5A6478; --line:#DCE1EA;
  --brand:#002060; --on-brand:#FFFFFF; --orange:#C97800; --orange-soft:#FDF1DF;
  --seat:#DDE2EB; --ok:#2E7D5B;
  --display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1322; --surface:#161F33; --ink:#E7EBF3; --muted:#9AA4B8; --line:#28334A;
  --brand:#8FA9E8; --on-brand:#0D1322; --orange:#F2A33A; --orange-soft:#3A2A14;
  --seat:#263045; --ok:#5CC18F;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1322; --surface:#161F33; --ink:#E7EBF3; --muted:#9AA4B8; --line:#28334A;
  --brand:#8FA9E8; --on-brand:#0D1322; --orange:#F2A33A; --orange-soft:#3A2A14;
  --seat:#263045; --ok:#5CC18F;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 96px}
.wrap{max-width:1200px;margin:0 auto;display:grid;gap:24px;grid-template-columns:minmax(0,1fr)}
.wrap>*{min-width:0}
h1,h2{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:.02em;color:var(--brand)}
h1{font-size:clamp(26px,6.5vw,36px);font-weight:900;line-height:1.3}
h2{font-size:20px;font-weight:600}
.h1l{display:inline-block}
.num{font-variant-numeric:tabular-nums}
.card-box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}

/* 頁首品牌列 */
.brandbar{display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--line)}
.org{display:flex;align-items:center;gap:12px;color:inherit;text-decoration:none;min-width:0}
.org img{width:56px;height:56px;flex:none;border-radius:50%;background:#fff;box-shadow:0 0 0 1px var(--line)}
.org-t{display:grid;line-height:1.3;min-width:0}
.org-t b{font-size:18px;color:var(--brand);letter-spacing:.06em}
.org-t span{font-size:13px;color:var(--muted)}
.school{margin-left:auto;display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.school img{display:block;height:26px;width:auto}

/* 上方兩張等高卡片 */
.top{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.intro{display:flex;flex-direction:column;gap:14px}
.lead{margin:0;color:var(--muted)}
.lead b{color:var(--ink)}
.pick{display:grid;gap:8px;margin-top:auto;padding-top:16px;border-top:1px dashed var(--line)}
.pick label{font-weight:700;font-size:14px}
.pick-row{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.pick select{width:100%;font:inherit;font-size:17px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-height:50px}
.go{display:flex;align-items:center;justify-content:center;padding:12px 18px;border-radius:10px;border:0;background:var(--brand);color:var(--on-brand);font:inherit;font-weight:700;font-size:17px;cursor:pointer;min-height:50px}
.go:hover{filter:brightness(1.12)}
.go:focus-visible,.pick select:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.pick .err{font-size:13px;color:#B4472B}

.hero{display:grid;gap:16px;align-content:start}
.hero-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.hero-h span{font-size:12px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:auto 1fr 1fr;align-items:end;gap:8px 20px}
.big{font-family:var(--display);font-weight:900;font-size:clamp(44px,11vw,60px);line-height:1;color:var(--brand)}
.big small{display:block;font-family:var(--body);font-size:13px;font-weight:500;color:var(--muted);margin-top:6px}
.kpi{display:grid;gap:2px}
.kpi b{font-size:24px;font-weight:700;line-height:1.1}
.kpi span{font-size:12px;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--seat);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.agm{display:grid;gap:10px;padding-top:16px;border-top:1px dashed var(--line)}
.agm-h{font-weight:700;display:flex;align-items:center;gap:8px}
.tag{font-size:12px;font-weight:700;color:var(--orange);background:var(--orange-soft);padding:2px 8px;border-radius:99px}
.agm-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.agm-row div{background:var(--bg);border-radius:10px;padding:10px 12px;display:grid;gap:2px}
.agm-row b{font-size:22px;line-height:1.1}
.agm-row .sum b{color:var(--orange)}
.agm-row span{font-size:12px;color:var(--muted);line-height:1.35}

/* 各屆卡片：統一格式 */
.sec{display:grid;gap:12px}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:8px 16px;flex-wrap:wrap}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;grid-template-rows:auto auto 1fr auto;gap:8px;color:inherit;text-decoration:none;min-width:0;transition:border-color .15s,box-shadow .15s}
.card:hover{border-color:var(--brand);box-shadow:0 2px 10px rgba(0,32,96,.08)}
.card:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.card-top{display:flex;align-items:baseline;justify-content:space-between;gap:6px}
.card h3{margin:0;font-family:var(--display);font-size:24px;font-weight:900;line-height:1;color:var(--brand)}
.card h3 small{font-family:var(--body);font-size:13px;font-weight:700;color:var(--muted);margin-left:2px}
.pct{font-size:14px;font-weight:700;color:var(--ok)}
.pct.na{color:var(--muted);font-weight:500}
.card .bar{height:6px}
.meta{font-size:13px;color:var(--muted);display:grid}
.meta b{color:var(--ink);font-weight:700}
.meta .agmc b{color:var(--orange)}
.enter{font-size:13px;font-weight:700;color:var(--brand)}
footer{font-size:12px;color:var(--muted);line-height:1.7;border-top:1px solid var(--line);padding-top:14px}

@media (min-width:600px){
  .pick-row{grid-template-columns:minmax(0,1fr) auto}
  .go{padding-inline:28px}
  .cards{grid-template-columns:repeat(4,minmax(0,1fr))}
  .card-box{padding:24px}
}
@media (min-width:1024px){
  body{padding-block:24px 96px}
  .top{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:stretch}
  .cards{grid-template-columns:repeat(6,minmax(0,1fr))}
  .org img{width:64px;height:64px}
  .school img{height:30px}
}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .6s ease}}
</style>
</head>
<body>
<div class="wrap">
  <header class="brandbar">
    <a class="org" href="./">
      <img src="tiea-logo.png" alt="TIEA 徽章" width="240" height="240">
      <span class="org-t"><b>TIEA</b><span>國立臺北科技大學 工業工程與管理 EMBA 協會</span></span>
    </a>
    <span class="school"><img src="logo.png" alt="國立臺北科技大學" width="600" height="91"></span>
  </header>

  <div class="top">
    <section class="intro card-box" aria-labelledby="h1">
      <h1 id="h1"><span class="h1l">會員資料更新</span> <span class="h1l">與第九屆會員大會</span></h1>
      <p class="lead">協會正在更新各屆的聯絡資料，也同步調查 <b id="agm-date">12/26</b> 第九屆會員大會的出席意願。請選擇你的屆別進入填寫，大約 2 分鐘。</p>
      <form class="pick" id="pick" novalidate>
        <label for="year">選擇你的屆別</label>
        <div class="pick-row">
          <select id="year" required aria-describedby="year-err"></select>
          <button class="go" type="submit">進入填寫 →</button>
        </div>
        <div class="err" id="year-err" hidden>請先選擇屆別。</div>
      </form>
    </section>

    <section class="hero card-box" aria-labelledby="h-prog">
      <div class="hero-h"><h2 id="h-prog">資料更新進度</h2><span id="updated"></span></div>
      <div class="kpis">
        <div class="big num" id="big"></div>
        <div class="kpi"><b class="num" id="pct"></b><span>更新率</span></div>
        <div class="kpi"><b class="num" id="classes"></b><span>屆別有名單</span></div>
      </div>
      <div class="bar" aria-hidden="true"><i id="bar"></i></div>
      <div class="agm">
        <div class="agm-h">第九屆會員大會 <span class="tag" id="agm-tag">12/26</span></div>
        <div class="agm-row">
          <div><b class="num" id="agm-n"></b><span>已報名出席</span></div>
          <div><b class="num" id="proxy-n"></b><span>願意提供委託書</span></div>
          <div class="sum"><b class="num" id="sum-n"></b><span>出席＋委託合計</span></div>
        </div>
      </div>
    </section>
  </div>

  <section class="sec" aria-labelledby="h-cards">
    <div class="sec-h">
      <h2 id="h-cards">各屆進度</h2>
      <div class="legend">
        <span><i class="dot" style="background:var(--ok)"></i>資料更新率</span>
        <span><i class="dot" style="background:var(--orange)"></i>大會出席＋委託</span>
      </div>
    </div>
    <div class="cards" id="cards"></div>
  </section>

  <footer id="foot"></footer>
</div>

<script src="data.js"></script>
<script>
const $ = id => document.getElementById(id);
const T = window.TIEA;
const years = Object.keys(T.classes).sort((a, b) => b - a);

// 本機記住自己剛送出的名字（各屆頁面寫入），讓自己的屆別先顯示已更新
function localDone(y){ try{ return JSON.parse(localStorage.getItem('tiea-sent-' + y) || '[]'); }catch(e){ return []; } }
function doneOf(y){ const c = T.classes[y]; const local = localDone(y); return c.people.filter(p => c.done.includes(p) || local.includes(p)).length; }

function render(){
  let total = 0, done = 0, agm = 0, proxy = 0, withRoster = 0;
  years.forEach(y => {
    const c = T.classes[y];
    total += c.people.length; done += doneOf(y); agm += c.agm; proxy += c.proxy;
    if (c.people.length) withRoster++;
  });
  $('updated').textContent = `更新：${T.updated}`;
  $('big').innerHTML = `${done}<small>/ ${total} 位已更新</small>`;
  $('pct').textContent = (total ? Math.round(done / total * 100) : 0) + '%';
  $('classes').textContent = `${withRoster} / ${years.length}`;
  $('bar').style.width = (total ? done / total * 100 : 0) + '%';
  $('agm-date').textContent = T.agmDate; $('agm-tag').textContent = T.agmDate;
  $('agm-n').textContent = agm; $('proxy-n').textContent = proxy; $('sum-n').textContent = agm + proxy;
  drawCards();
}

// 各屆卡片：有沒有名單都用同一個格式，讓格子對齊
function drawCards(){
  $('cards').innerHTML = years.map(y => {
    const c = T.classes[y], n = c.people.length, d = doneOf(y), a = c.agm + c.proxy;
    const pct = n ? Math.round(d / n * 100) : 0;
    return `<a class="card" href="class.html?c=${y}">
      <div class="card-top"><h3>${y}<small>級</small></h3><span class="pct num${n ? '' : ' na'}">${n ? pct + '%' : '—'}</span></div>
      <div class="bar" aria-hidden="true"><i style="width:${n ? d / n * 100 : 0}%"></i></div>
      <div class="meta">
        <span>${n ? `已更新 <b class="num">${d}</b> / ${n} 人` : '尚無名單，可直接填寫'}</span>
        <span class="agmc">大會 <b class="num">${a}</b> 人</span>
      </div>
      <span class="enter">進入填寫 →</span></a>`;
  }).join('');
}

// 屆別選單
$('year').innerHTML = '<option value="">請選擇屆別</option>' + years.map(y => `<option value="${y}">${y} 級</option>`).join('');
$('pick').addEventListener('submit', e => {
  e.preventDefault();
  const y = $('year').value;
  if (!y){ $('year-err').hidden = false; $('year').focus(); return; }
  location.href = 'class.html?c=' + encodeURIComponent(y);
});
$('year').addEventListener('change', () => { $('year-err').hidden = true; });

const srcs = [...new Set(years.map(y => T.classes[y].source).filter(Boolean))];
$('foot').textContent = `名單來源：${srcs.join('、')}。沒有名單的屆別可以直接填寫。「大會」為已報名出席＋願意提供委託書的人數。送出後約一分鐘，重新整理頁面就能看到最新數字。`;

render();

// 即時進度：從試算表讀取各屆已更新名單與大會人數
if (T.api) fetch(T.api + '?action=stats').then(r => r.json()).then(s => {
  if (s.updated) T.updated = s.updated;
  Object.entries(s.classes || {}).forEach(([y, live]) => {
    const c = T.classes[y]; if (!c) return;
    c.done = live.done; c.agm = live.agm; c.proxy = live.proxy;
  });
  render();
}).catch(() => {});
</script>
</body>
</html>
